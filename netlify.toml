# Netlify 로 배포하는 경우의 설정.
# (Cloudflare Pages 는 빌드 명령 `npm run build`, 출력 디렉터리 `_site` 로 설정하면
#  _redirects / _headers 파일을 그대로 인식합니다.)

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  # canonical / OG / sitemap 에 쓰이는 주소. 실제 도메인으로 바꿔 주세요.
  SITE_URL = "https://www.trialinfo.com"

# 리다이렉트와 응답 헤더는 빌드 산출물의 _redirects / _headers 에서 관리합니다.
# (원본: src/_data/redirects.js, src/netlify-headers.njk)
