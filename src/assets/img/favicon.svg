<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="(주)트라이얼정보통신">
  <!--
    회사 CI(src/images/logo/logo.svg)에서 뽑아낸 모노그램 아이콘입니다.
    아래 두 도형은 손으로 그린 게 아니라 CI 파일의 실제 패스입니다.
      - "TRIAL" 의 T 글자
      - "i" 위에 얹히는 빨간 점(#D7000F)

    왜 T 한 글자인가
      파비콘이 실제로 쓰이는 크기는 16px 입니다. 워드마크 다섯 글자를 그
      안에 넣으면 글자당 2px 남짓이라 붉은 얼룩으로만 보였습니다. CI 에서
      가장 먼저 읽히는 T 와 상징색 점만 남기면 16px 에서도 형태가 삽니다.

    좌표
      CI 좌표계에서 T 는 (0, 8.93)–(12.54, 31.10), 점은 (35.28, 3.98) 반지름 3.19.
      점을 T 위로 옮기려고 x 를 29.01 만큼 왼쪽으로 당겼습니다
      (35.28 - 29.01 = 6.27 = T 의 가로 중심). 패스 안의 절대 좌표(M, 마지막 C)만
      바뀌고 상대 좌표(c)는 그대로입니다.
      묶음 전체는 translate(21.66, 5.70) scale(1.65) 로 64×64 한가운데에 놓입니다
      → 위아래 여백 7px, 좌우 21.7px.

    바탕을 어둡게 둔 이유
      CI 원본은 흰 바탕에 검은 글씨입니다. 그대로 축소하면 밝은 브라우저 탭에서
      아이콘 경계가 사라집니다. 회사가 어두운 배경에 쓰는 흰색 CI(logo_wt.svg)와
      같은 조합으로, 밝은 탭·어두운 탭 양쪽에서 형태가 유지됩니다.

    ⚠️ 이 파일을 고치면 `npm run make:icons` 로 PNG 를 다시 만드세요.
       (tools/make-icons.mjs 가 이 SVG 를 직접 읽어 래스터화합니다.
        <g> 는 한 겹만 지원하므로 그룹을 중첩하지 마세요.)
  -->
  <rect width="64" height="64" rx="13" fill="#161519"/>
  <g transform="translate(21.66, 5.70) scale(1.65)">
    <path fill="#D7000F" d="M9.46,3.98c0,1.76-1.43,3.19-3.19,3.19c-1.76,0-3.19-1.43-3.19-3.19c0-1.76,1.43-3.19,3.19-3.19 C8.04,0.79,9.46,2.22,9.46,3.98z"/>
    <path fill="#fff" d="M12.54,8.93v4.26H9.08v17.91H3.46V13.19H0V8.93H12.54z"/>
  </g>
</svg>
