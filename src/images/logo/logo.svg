<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 34" width="180" height="34"
     role="img" aria-label="(주)트라이얼정보통신 Trial Info Communication">
  <!--
    밝은 배경용 로고 (헤더 기본 상태 / 흰 배경).
    어두운 배경용은 같은 폴더의 logo_wt.svg 입니다.

    favicon.svg 와 같은 조형(둥근 사각형 + T + 액센트 점)을 씁니다.
    실제 브랜드 로고 파일이 있으면 같은 이름으로 덮어쓰면 됩니다.
    (권장 비율 180 x 34. 비율이 달라도 헤더에서 높이에 맞춰 축소됩니다.)

    글자는 textLength 로 폭을 고정해 두었습니다. 시스템 글꼴이 무엇이든
    로고 폭이 흔들리지 않습니다.
  -->
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5299"/>
      <stop offset="1" stop-color="#041c3c"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 2) scale(0.46875)">
    <rect width="64" height="64" rx="14" fill="url(#markGradient)"/>
    <path d="M15 20h34v7H36.5v22h-8.5V27H15z" fill="#fff"/>
    <circle cx="49" cy="46" r="4.5" fill="#00a6c8"/>
  </g>

  <text x="39" y="17.5" textLength="102" lengthAdjust="spacingAndGlyphs"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="800" fill="#041c3c">TRIALINFO</text>

  <text x="39" y="28.5" textLength="102" lengthAdjust="spacingAndGlyphs"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="7" font-weight="600" fill="#0f5299">COMMUNICATION</text>
</svg>
