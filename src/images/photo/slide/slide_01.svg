<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="데이터센터 랙 이미지">
  <!--
    메인 슬라이드 1 — 데이터센터 랙.
    사진 대신 벡터로 그린 배경 이미지입니다. 히어로에서는 어두운 그라디언트가
    위에 겹쳐지므로(main.css 의 .hero__media::after) 형태만 은은하게 보입니다.

    실제 사진으로 바꾸려면 파일을 넣고 src/_data/hero.js 의 image 경로만
    바꿔 주세요. (예: "/images/photo/slide/slide_01.jpg")
  -->
  <defs>
    <linearGradient id="s1Sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0a3d78"/>
      <stop offset="0.55" stop-color="#062a55"/>
      <stop offset="1" stop-color="#03142c"/>
    </linearGradient>
    <linearGradient id="s1Rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a4d"/>
      <stop offset="1" stop-color="#061527"/>
    </linearGradient>
    <radialGradient id="s1Glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#1b6fb8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b6fb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#s1Sky)"/>
  <rect width="1600" height="900" fill="url(#s1Glow)"/>

  <!-- 통로 바닥 -->
  <path d="M0 900 L640 560 H960 L1600 900 Z" fill="#03101f"/>
  <path d="M640 560 H960 L1600 900 H0 Z" fill="none" stroke="#0f4f8f" stroke-opacity="0.35"/>

  <!-- 좌우 랙 열: 원근을 주기 위해 위쪽으로 갈수록 낮고 좁아집니다 -->
  <g fill="url(#s1Rack)" stroke="#124d86" stroke-opacity="0.45">
    <path d="M0 250 L300 400 V900 H0 Z"/>
    <path d="M300 400 L470 485 V830 L300 900 Z"/>
    <path d="M470 485 L580 540 V775 L470 830 Z"/>
    <path d="M1600 250 L1300 400 V900 H1600 Z"/>
    <path d="M1300 400 L1130 485 V830 L1300 900 Z"/>
    <path d="M1130 485 L1020 540 V775 L1130 830 Z"/>
  </g>

  <!-- 랙 안 장비 표시등 -->
  <g fill="#38d3f5" fill-opacity="0.75">
    <g>
      <rect x="40" y="330" width="150" height="6" rx="3"/>
      <rect x="40" y="380" width="110" height="6" rx="3"/>
      <rect x="40" y="430" width="170" height="6" rx="3"/>
      <rect x="40" y="480" width="90" height="6" rx="3"/>
      <rect x="40" y="530" width="140" height="6" rx="3"/>
      <rect x="40" y="580" width="120" height="6" rx="3"/>
      <rect x="330" y="470" width="100" height="5" rx="2.5"/>
      <rect x="330" y="515" width="70" height="5" rx="2.5"/>
      <rect x="330" y="560" width="110" height="5" rx="2.5"/>
      <rect x="330" y="605" width="85" height="5" rx="2.5"/>
    </g>
    <g>
      <rect x="1410" y="330" width="150" height="6" rx="3"/>
      <rect x="1450" y="380" width="110" height="6" rx="3"/>
      <rect x="1390" y="430" width="170" height="6" rx="3"/>
      <rect x="1470" y="480" width="90" height="6" rx="3"/>
      <rect x="1420" y="530" width="140" height="6" rx="3"/>
      <rect x="1440" y="580" width="120" height="6" rx="3"/>
      <rect x="1170" y="470" width="100" height="5" rx="2.5"/>
      <rect x="1200" y="515" width="70" height="5" rx="2.5"/>
      <rect x="1160" y="560" width="110" height="5" rx="2.5"/>
      <rect x="1185" y="605" width="85" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- 천장 조명 -->
  <g fill="#7fd6f0" fill-opacity="0.5">
    <rect x="700" y="120" width="200" height="10" rx="5"/>
    <rect x="730" y="200" width="140" height="8" rx="4"/>
    <rect x="750" y="270" width="100" height="6" rx="3"/>
  </g>

  <!-- 소멸점 쪽 밝은 통로 -->
  <path d="M640 560 H960 L1000 900 H600 Z" fill="#0d4c8c" fill-opacity="0.35"/>
</svg>
