<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="네트워크 연결 이미지">
  <!--
    메인 슬라이드 2 — 연결/네트워크.
    슬라이드 1과 같은 방식(벡터 배경)입니다. 자세한 설명은 slide_01.svg 참고.
  -->
  <defs>
    <linearGradient id="s2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a55"/>
      <stop offset="0.5" stop-color="#04203f"/>
      <stop offset="1" stop-color="#010c1c"/>
    </linearGradient>
    <radialGradient id="s2Glow" cx="0.68" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#00a6c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00a6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#s2Bg)"/>
  <rect width="1600" height="900" fill="url(#s2Glow)"/>

  <!-- 위도/경도를 연상시키는 호 -->
  <g fill="none" stroke="#3d8fd0" stroke-opacity="0.3" stroke-width="1.5">
    <circle cx="1080" cy="380" r="150"/>
    <circle cx="1080" cy="380" r="240"/>
    <circle cx="1080" cy="380" r="330"/>
    <circle cx="1080" cy="380" r="430"/>
    <ellipse cx="1080" cy="380" rx="330" ry="120"/>
    <ellipse cx="1080" cy="380" rx="330" ry="240"/>
    <path d="M750 380 A330 330 0 0 1 1410 380"/>
  </g>

  <!-- 노드를 잇는 선 -->
  <g stroke="#5fc8e8" stroke-opacity="0.4" stroke-width="1.5">
    <path d="M180 690 L430 540 L700 600 L940 430 L1180 300 L1420 210" fill="none"/>
    <path d="M430 540 L520 300 L780 240 L940 430" fill="none"/>
    <path d="M700 600 L860 760 L1120 690 L1180 300" fill="none"/>
    <path d="M1120 690 L1420 620 L1420 210" fill="none"/>
    <path d="M180 690 L300 420 L520 300" fill="none"/>
  </g>

  <!-- 노드 -->
  <g fill="#8ce0f5">
    <circle cx="180" cy="690" r="6"/>
    <circle cx="430" cy="540" r="8"/>
    <circle cx="700" cy="600" r="6"/>
    <circle cx="940" cy="430" r="11" fill="#00c2e8"/>
    <circle cx="1180" cy="300" r="8"/>
    <circle cx="1420" cy="210" r="6"/>
    <circle cx="520" cy="300" r="6"/>
    <circle cx="780" cy="240" r="5"/>
    <circle cx="860" cy="760" r="5"/>
    <circle cx="1120" cy="690" r="7"/>
    <circle cx="1420" cy="620" r="5"/>
    <circle cx="300" cy="420" r="5"/>
  </g>

  <!-- 중심 노드 강조 -->
  <g fill="none" stroke="#00c2e8" stroke-opacity="0.5">
    <circle cx="940" cy="430" r="26"/>
    <circle cx="940" cy="430" r="44" stroke-opacity="0.25"/>
  </g>

  <!-- 아래쪽 실루엣: 도시/데이터센터 -->
  <g fill="#020e1e" fill-opacity="0.85">
    <path d="M0 900 V760 H90 V700 H180 V780 H260 V730 H340 V820 H430 V760 H520 V900 Z"/>
    <path d="M1600 900 V740 H1500 V690 H1400 V770 H1310 V720 H1230 V810 H1140 V900 Z"/>
  </g>
</svg>
