<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     role="img" aria-label="2U 랙마운트 서버 전면">
  <!--
    2U 랙마운트 서버 (전면) — 제품 카드용 대표 이미지.

    제조사 제공 사진을 넣기 전까지 쓰는 벡터 일러스트입니다. 특정 모델의
    사진이 아니라 폼팩터(2U)를 보여 주는 그림이며, 카드에는 제품명·모델명이
    함께 표시됩니다.

    실제 사진으로 교체하려면 파일을 src/images/photo/product/ 아래에 넣고
    src/_data/catalog.js 의 해당 항목 image 경로를 바꿔 주세요.
  -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf3"/>
      <stop offset="0.5" stop-color="#cfd8e3"/>
      <stop offset="1" stop-color="#aeb9c7"/>
    </linearGradient>
    <linearGradient id="bayFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d99a8"/>
      <stop offset="1" stop-color="#5f6b7a"/>
    </linearGradient>

    <!-- 드라이브 베이 하나 -->
    <g id="bay">
      <rect width="42" height="74" rx="4" fill="url(#bayFill)"/>
      <rect x="6" y="8" width="8" height="58" rx="2" fill="#3f4a58"/>
      <circle cx="31" cy="18" r="3.5" fill="#00c2e8"/>
    </g>
  </defs>

  <g transform="translate(40 150)">
    <!-- 랙 이어(마운팅 브래킷) -->
    <rect x="0" y="10" width="26" height="180" rx="4" fill="#7c8796"/>
    <rect x="694" y="10" width="26" height="180" rx="4" fill="#7c8796"/>
    <g fill="#4c5866">
      <circle cx="13" cy="34" r="5"/>
      <circle cx="13" cy="100" r="5"/>
      <circle cx="13" cy="166" r="5"/>
      <circle cx="707" cy="34" r="5"/>
      <circle cx="707" cy="100" r="5"/>
      <circle cx="707" cy="166" r="5"/>
    </g>

    <!-- 섀시 전면 -->
    <rect x="20" y="0" width="680" height="200" rx="10" fill="url(#face)" stroke="#8b96a5" stroke-width="2"/>

    <!-- 왼쪽 베젤: 전원 버튼과 상태 표시등 -->
    <rect x="34" y="14" width="86" height="172" rx="6" fill="#b9c3d0"/>
    <circle cx="77" cy="52" r="15" fill="none" stroke="#4c5866" stroke-width="3"/>
    <path d="M77 42v14" stroke="#4c5866" stroke-width="3" stroke-linecap="round"/>
    <rect x="60" y="92" width="34" height="6" rx="3" fill="#00a6c8"/>
    <rect x="60" y="110" width="34" height="6" rx="3" fill="#7f8b9a"/>
    <rect x="60" y="128" width="34" height="6" rx="3" fill="#7f8b9a"/>
    <rect x="52" y="158" width="50" height="12" rx="3" fill="#8d99a8"/>

    <!-- 드라이브 베이 2단 × 11열 -->
    <use href="#bay" x="136" y="24"/>
    <use href="#bay" x="187" y="24"/>
    <use href="#bay" x="238" y="24"/>
    <use href="#bay" x="289" y="24"/>
    <use href="#bay" x="340" y="24"/>
    <use href="#bay" x="391" y="24"/>
    <use href="#bay" x="442" y="24"/>
    <use href="#bay" x="493" y="24"/>
    <use href="#bay" x="544" y="24"/>
    <use href="#bay" x="595" y="24"/>
    <use href="#bay" x="646" y="24"/>
    <use href="#bay" x="136" y="104"/>
    <use href="#bay" x="187" y="104"/>
    <use href="#bay" x="238" y="104"/>
    <use href="#bay" x="289" y="104"/>
    <use href="#bay" x="340" y="104"/>
    <use href="#bay" x="391" y="104"/>
    <use href="#bay" x="442" y="104"/>
    <use href="#bay" x="493" y="104"/>
    <use href="#bay" x="544" y="104"/>
    <use href="#bay" x="595" y="104"/>
    <use href="#bay" x="646" y="104"/>

    <!-- 접지 그림자 -->
    <ellipse cx="360" cy="216" rx="330" ry="10" fill="#8b96a5" fill-opacity="0.35"/>
  </g>
</svg>
