<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     role="img" aria-label="4U 랙마운트 서버 전면">
  <!--
    4U 랙마운트 서버 (전면) — 제품 카드용 대표 이미지.
    성격과 교체 방법은 server-2u.svg 의 주석과 같습니다.
  -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf3"/>
      <stop offset="0.5" stop-color="#cfd8e3"/>
      <stop offset="1" stop-color="#aeb9c7"/>
    </linearGradient>
    <linearGradient id="bayFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d99a8"/>
      <stop offset="1" stop-color="#5f6b7a"/>
    </linearGradient>

    <g id="bay">
      <rect width="42" height="74" rx="4" fill="url(#bayFill)"/>
      <rect x="6" y="8" width="8" height="58" rx="2" fill="#3f4a58"/>
      <circle cx="31" cy="18" r="3.5" fill="#00c2e8"/>
    </g>

    <!-- 통풍구 열 -->
    <g id="ventRow" fill="#6d798a" fill-opacity="0.6">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="12" cy="0" r="3"/>
      <circle cx="24" cy="0" r="3"/>
      <circle cx="36" cy="0" r="3"/>
      <circle cx="48" cy="0" r="3"/>
      <circle cx="60" cy="0" r="3"/>
      <circle cx="72" cy="0" r="3"/>
      <circle cx="84" cy="0" r="3"/>
    </g>
  </defs>

  <g transform="translate(60 55)">
    <!-- 랙 이어 -->
    <rect x="0" y="12" width="26" height="366" rx="4" fill="#7c8796"/>
    <rect x="654" y="12" width="26" height="366" rx="4" fill="#7c8796"/>
    <g fill="#4c5866">
      <circle cx="13" cy="40" r="5"/>
      <circle cx="13" cy="130" r="5"/>
      <circle cx="13" cy="260" r="5"/>
      <circle cx="13" cy="350" r="5"/>
      <circle cx="667" cy="40" r="5"/>
      <circle cx="667" cy="130" r="5"/>
      <circle cx="667" cy="260" r="5"/>
      <circle cx="667" cy="350" r="5"/>
    </g>

    <!-- 섀시 전면 -->
    <rect x="20" y="0" width="640" height="390" rx="12" fill="url(#face)" stroke="#8b96a5" stroke-width="2"/>

    <!-- 왼쪽 베젤 -->
    <rect x="34" y="14" width="92" height="362" rx="6" fill="#b9c3d0"/>
    <circle cx="80" cy="56" r="16" fill="none" stroke="#4c5866" stroke-width="3"/>
    <path d="M80 45v15" stroke="#4c5866" stroke-width="3" stroke-linecap="round"/>
    <rect x="62" y="100" width="36" height="6" rx="3" fill="#00a6c8"/>
    <rect x="62" y="118" width="36" height="6" rx="3" fill="#7f8b9a"/>
    <rect x="62" y="136" width="36" height="6" rx="3" fill="#7f8b9a"/>
    <g transform="translate(44 190)">
      <use href="#ventRow" y="0"/>
      <use href="#ventRow" y="16"/>
      <use href="#ventRow" y="32"/>
      <use href="#ventRow" y="48"/>
      <use href="#ventRow" y="64"/>
      <use href="#ventRow" y="80"/>
    </g>
    <rect x="54" y="340" width="56" height="14" rx="3" fill="#8d99a8"/>

    <!-- 드라이브 베이 4단 × 9열 -->
    <use href="#bay" x="146" y="22"/>
    <use href="#bay" x="197" y="22"/>
    <use href="#bay" x="248" y="22"/>
    <use href="#bay" x="299" y="22"/>
    <use href="#bay" x="350" y="22"/>
    <use href="#bay" x="401" y="22"/>
    <use href="#bay" x="452" y="22"/>
    <use href="#bay" x="503" y="22"/>
    <use href="#bay" x="554" y="22"/>
    <use href="#bay" x="605" y="22"/>
    <use href="#bay" x="146" y="112"/>
    <use href="#bay" x="197" y="112"/>
    <use href="#bay" x="248" y="112"/>
    <use href="#bay" x="299" y="112"/>
    <use href="#bay" x="350" y="112"/>
    <use href="#bay" x="401" y="112"/>
    <use href="#bay" x="452" y="112"/>
    <use href="#bay" x="503" y="112"/>
    <use href="#bay" x="554" y="112"/>
    <use href="#bay" x="605" y="112"/>
    <use href="#bay" x="146" y="202"/>
    <use href="#bay" x="197" y="202"/>
    <use href="#bay" x="248" y="202"/>
    <use href="#bay" x="299" y="202"/>
    <use href="#bay" x="350" y="202"/>
    <use href="#bay" x="401" y="202"/>
    <use href="#bay" x="452" y="202"/>
    <use href="#bay" x="503" y="202"/>
    <use href="#bay" x="554" y="202"/>
    <use href="#bay" x="605" y="202"/>
    <use href="#bay" x="146" y="292"/>
    <use href="#bay" x="197" y="292"/>
    <use href="#bay" x="248" y="292"/>
    <use href="#bay" x="299" y="292"/>
    <use href="#bay" x="350" y="292"/>
    <use href="#bay" x="401" y="292"/>
    <use href="#bay" x="452" y="292"/>
    <use href="#bay" x="503" y="292"/>
    <use href="#bay" x="554" y="292"/>
    <use href="#bay" x="605" y="292"/>

    <!-- 접지 그림자 -->
    <ellipse cx="340" cy="404" rx="310" ry="10" fill="#8b96a5" fill-opacity="0.35"/>
  </g>
</svg>
