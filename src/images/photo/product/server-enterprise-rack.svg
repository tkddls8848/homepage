<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     role="img" aria-label="엔터프라이즈 랙 서버 전면">
  <!--
    엔터프라이즈 랙 서버(다중 노드 구성, 전면) — 제품 카드용 대표 이미지.
    성격과 교체 방법은 server-2u.svg 의 주석과 같습니다.
  -->
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6675"/>
      <stop offset="0.14" stop-color="#7b8695"/>
      <stop offset="0.86" stop-color="#6d798a"/>
      <stop offset="1" stop-color="#495563"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4eaf1"/>
      <stop offset="1" stop-color="#b6c1cf"/>
    </linearGradient>

    <!-- 시스템 노드 한 대 (전면) -->
    <g id="systemNode">
      <rect width="252" height="62" rx="5" fill="url(#node)" stroke="#8b96a5"/>
      <rect x="8" y="8" width="30" height="46" rx="3" fill="#aab5c3"/>
      <circle cx="23" cy="20" r="4" fill="#00c2e8"/>
      <rect x="14" y="32" width="18" height="5" rx="2.5" fill="#67737f"/>
      <rect x="14" y="42" width="18" height="5" rx="2.5" fill="#67737f"/>
      <g fill="#93a0af">
        <rect x="48" y="10" width="28" height="42" rx="3"/>
        <rect x="82" y="10" width="28" height="42" rx="3"/>
        <rect x="116" y="10" width="28" height="42" rx="3"/>
        <rect x="150" y="10" width="28" height="42" rx="3"/>
        <rect x="184" y="10" width="28" height="42" rx="3"/>
        <rect x="218" y="10" width="26" height="42" rx="3"/>
      </g>
      <g fill="#5f6b7a">
        <rect x="54" y="16" width="6" height="30" rx="3"/>
        <rect x="88" y="16" width="6" height="30" rx="3"/>
        <rect x="122" y="16" width="6" height="30" rx="3"/>
        <rect x="156" y="16" width="6" height="30" rx="3"/>
        <rect x="190" y="16" width="6" height="30" rx="3"/>
        <rect x="224" y="16" width="6" height="30" rx="3"/>
      </g>
    </g>
  </defs>

  <g transform="translate(240 26)">
    <!-- 캐비닛 -->
    <rect x="0" y="0" width="320" height="440" rx="10" fill="url(#cabinet)"/>
    <rect x="14" y="16" width="292" height="408" rx="6" fill="#2f3a47"/>

    <!-- 상단 표시 패널 -->
    <rect x="28" y="26" width="264" height="30" rx="4" fill="#1b2531"/>
    <circle cx="46" cy="41" r="6" fill="#00c2e8"/>
    <rect x="62" y="37" width="80" height="7" rx="3.5" fill="#4c5866"/>
    <rect x="150" y="37" width="46" height="7" rx="3.5" fill="#3a4653"/>

    <!-- 시스템 노드 4대 -->
    <use href="#systemNode" x="34" y="70"/>
    <use href="#systemNode" x="34" y="142"/>
    <use href="#systemNode" x="34" y="214"/>
    <use href="#systemNode" x="34" y="286"/>

    <!-- 하단 전원/배선 영역 -->
    <rect x="34" y="358" width="252" height="54" rx="5" fill="#3f4a58"/>
    <g fill="#616e7d">
      <rect x="46" y="370" width="52" height="30" rx="3"/>
      <rect x="106" y="370" width="52" height="30" rx="3"/>
      <rect x="166" y="370" width="52" height="30" rx="3"/>
      <rect x="226" y="370" width="48" height="30" rx="3"/>
    </g>
    <g fill="#00a6c8">
      <circle cx="60" cy="378" r="3"/>
      <circle cx="120" cy="378" r="3"/>
      <circle cx="180" cy="378" r="3"/>
      <circle cx="240" cy="378" r="3"/>
    </g>

    <!-- 캐스터 -->
    <rect x="40" y="440" width="18" height="12" rx="4" fill="#495563"/>
    <rect x="262" y="440" width="18" height="12" rx="4" fill="#495563"/>

    <!-- 접지 그림자 -->
    <ellipse cx="160" cy="458" rx="170" ry="10" fill="#8b96a5" fill-opacity="0.35"/>
  </g>
</svg>
