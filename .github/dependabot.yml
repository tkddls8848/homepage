# 의존성 자동 업데이트.
#
# 이 설정이 없어서 GitHub Actions 가 2~3 메이저 뒤처져 있었습니다
# (checkout v4 → v7, setup-node v4 → v7 등). 사람이 주기적으로 확인하는 것에
# 기대지 않고, 새 버전이 나오면 Dependabot 이 PR 을 열게 합니다.
#
# PR 은 자동 병합되지 않습니다. 확인 후 직접 병합하세요.
# 병합하면 main 푸시로 Build & Deploy 워크플로가 돌아 검증됩니다.
version: 2

updates:
  # 워크플로가 쓰는 액션들. 공급망 관점에서 가장 중요합니다.
  # (액션은 남의 코드가 우리 CI 안에서 실행되는 것이라, 오래 방치할수록
  #  이미 고쳐진 보안 문제를 그대로 안고 가게 됩니다.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # npm 의존성. 현재는 Eleventy 하나뿐입니다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    # 자잘한 패치 PR 이 매달 여러 개 열리는 것을 막습니다.
    groups:
      all-dependencies:
        patterns:
          - "*"
