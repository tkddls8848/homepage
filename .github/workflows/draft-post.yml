name: 블로그 초안 생성

# IBM Bob 으로 기술 블로그 초안을 만들어 PR 을 엽니다.
#
# 이 워크플로는 배포와 무관합니다. 사이트 배포는 Cloudflare Pages 가
# main 브랜치를 보고 직접 합니다.
#
# 만들어지는 글은 draft: true 라서 병합해도 사이트에 나오지 않습니다.
# 담당자가 내용을 확인하고 draft 줄을 지워야 발행됩니다.
# LLM 이 쓴 초안을 검토 없이 회사 이름으로 내보내지 않으려는 장치입니다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions → Secrets 에
#   BOBSHELL_API_KEY   IBM Bob API 키

on:
  schedule:
    # 매주 월요일 09:00 KST (UTC 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draft-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # 초안 생성 자체에는 npm 의존성이 필요 없습니다(fetch 와 Bob Shell 만 씁니다).
      # 아래 빌드 검증 단계에서 Eleventy 가 필요해 설치합니다.
      - run: npm ci

      - name: Bob Shell 설치
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash
          # 설치 스크립트가 PATH 에 넣는 위치가 셸 세션마다 다를 수 있어
          # 실제 경로를 찾아 다음 단계로 넘깁니다.
          BOB_BIN="$(command -v bob || true)"
          if [ -z "$BOB_BIN" ]; then
            BOB_BIN="$(find "$HOME" -maxdepth 4 -type f -name bob -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$BOB_BIN" ]; then
            echo "Bob Shell 실행 파일을 찾지 못했습니다." >&2
            exit 1
          fi
          echo "BOBSHELL_BIN=$BOB_BIN" >> "$GITHUB_ENV"
          echo "설치 위치: $BOB_BIN"

      - name: 초안 생성
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: npm run draft:post

      # 초안이 사이트를 깨뜨리지 않는지 확인합니다. draft: true 라 페이지는
      # 생성되지 않지만, front matter 가 잘못되면 빌드가 실패합니다.
      - name: 빌드 검증
        run: npm run build

      - name: 변경 여부 확인
        id: changed
        run: |
          if [ -z "$(git status --porcelain src/blog/posts)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "생성된 초안이 없습니다 (관련 기사가 없었을 수 있습니다)."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 생성
        if: steps.changed.outputs.any == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: blog-draft/${{ github.run_id }}
          title: "블로그 초안: AI 생성본 검토 요청"
          commit-message: |
            블로그 초안 자동 생성 (IBM Bob)

            draft: true 상태라 병합해도 사이트에는 나오지 않습니다.
          body: |
            IBM Bob 이 만든 초안입니다. **검토 전에는 발행되지 않습니다.**

            ## 확인할 것

            - [ ] 사실관계 — 모델이 지어낸 수치·제품명·날짜가 없는지
            - [ ] 참고 기사 링크가 실제로 열리는지
            - [ ] 기사 본문을 그대로 옮긴 문장이 없는지
            - [ ] 회사 입장으로 내보내도 되는 내용인지

            ## 발행 방법

            내용을 고친 뒤 front matter 의 `draft: true` 줄을 지우고 병합하세요.
            그 줄이 있는 동안에는 페이지가 생성되지 않습니다.
          labels: |
            blog
            ai-draft
          add-paths: src/blog/posts
