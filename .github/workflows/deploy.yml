name: Build & Deploy

# 정적 사이트를 빌드해 GitHub Pages 로 배포합니다.
# GitHub Pages 는 기본으로 HTTPS 를 제공하므로, 기존 사이트의 http 접속 문제가
# 배포 방식만 바꿔도 해결됩니다.
#   저장소 Settings → Pages → Source: "GitHub Actions" 로 설정하세요.
#   사용자 도메인(www.trialinfo.com)을 쓸 경우 Custom domain 입력 후
#   "Enforce HTTPS" 를 켜 주세요.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # canonical / OG / sitemap 에 쓰이는 사이트 주소
          SITE_URL: ${{ vars.SITE_URL || 'https://www.trialinfo.com' }}
          # 문의 폼을 처리할 엔드포인트 (없으면 mailto 로 동작)
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

      - name: Check internal links
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
